<!DOCTYPE html>
<!--
  Browser mic test for stt-streaming + turn-detection (via examples/mic_proxy.py).

  Captures the mic -> 16 kHz PCM16 -> proxy. The proxy runs STT, both turn-detection
  models (audio prosody + text semantics) and the Silero silence backstop, and tells
  this page when a *turn* ends. Each finished turn gets its own highlighted line.

  Run (in your Cursor terminal, like a dev server):
    python3 examples/mic_proxy.py --port 8080
  then open the forwarded http://localhost:8080/ , click Start, and talk.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stt + turn-detection · mic test</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         max-width: 860px; margin: 28px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.25rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  label { font-size: .82rem; opacity: .8; min-width: 64px; }
  input { flex: 1; min-width: 220px; padding: 8px 10px; border: 1px solid #8888; border-radius: 8px;
          font: inherit; background: transparent; color: inherit; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  #start { background: #1f883d; color: #fff; } #stop { background: #cf222e; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status { font-size: .82rem; padding: 6px 10px; border-radius: 8px; background: #8881; }
  #dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#999; margin-right:6px; vertical-align:middle; }
  .live #dot { background:#1f883d; animation:pulse 1s infinite; } @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .meters { display:grid; grid-template-columns: 92px 1fr 48px; gap:6px 10px; align-items:center;
            margin:14px 0; font-size:.8rem; }
  .bar { position:relative; height:10px; border-radius:5px; background:#8882; overflow:hidden; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; width:0; transition:width .08s linear; }
  .bar.audio > i { background:#0969da; } .bar.text > i { background:#8250df; } .bar.sil > i { background:#bf8700; }
  .bar .thresh { position:absolute; top:-2px; bottom:-2px; width:2px; background:#cf222e88; }
  .val { text-align:right; font-variant-numeric:tabular-nums; opacity:.8; }

  #turns { margin-top:10px; }
  .turn { padding:10px 12px; margin:8px 0; border-radius:10px; border:1px solid #8883; }
  .turn.current { border-style:dashed; opacity:.95; }
  .turn.done { background:#1f883d18; border-color:#1f883d66; }
  .turn .txt { font-size:1.15rem; }
  .turn .interim { opacity:.5; font-style:italic; }
  .turn .badge { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px;
                 margin-left:8px; vertical-align:middle; }
  .badge.audio{background:#0969da22;color:#0969da} .badge.text{background:#8250df22;color:#8250df}
  .badge.silence{background:#bf870022;color:#bf8700} .badge.close{background:#8883}
  .meter { height:6px; border-radius:3px; background:#8883; overflow:hidden; margin-top:6px; }
  .meter > div { height:100%; width:0; background:#1f883d; transition:width .05s; }
  #log { margin-top:12px; font-size:.72rem; opacity:.7; white-space:pre-wrap; max-height:120px; overflow:auto; }
</style>
</head>
<body>
  <h1>🎙️ stt-streaming + turn-detection — live mic test</h1>

  <div class="row">
    <label for="url">WS URL</label><input id="url" value="" />
  </div>
  <div class="row">
    <label for="key">API key</label><input id="key" type="password" placeholder="(blank when using mic_proxy.py)" />
  </div>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
    <span id="status"><span id="dot"></span><span id="statusText">idle</span></span>
  </div>
  <div class="meter"><div id="level"></div></div>

  <div class="meters">
    <span>Audio EOU</span><div class="bar audio"><i id="barAudio"></i><span class="thresh" style="left:85%"></span></div><span class="val" id="valAudio">0.00</span>
    <span>Text EOU</span><div class="bar text"><i id="barText"></i><span class="thresh" style="left:85%"></span></div><span class="val" id="valText">0.00</span>
    <span>Silence</span><div class="bar sil"><i id="barSil"></i></div><span class="val" id="valSil">0.0s</span>
  </div>

  <div id="turns"></div>
  <div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const startBtn=$("start"), stopBtn=$("stop"), statusText=$("statusText"), levelEl=$("level");
const TARGET_SR=16000, FRAME_SAMPLES=320;
let ws, audioCtx, micStream, workletNode, sourceNode, pcmQueue=[], resampPos=0;
let backstopMs=4000, curTurn=null;

function log(m){ const el=$("log"); el.textContent+=m+"\n"; el.scrollTop=el.scrollHeight; }
function setStatus(t,live){ statusText.textContent=t; document.body.classList.toggle("live",!!live); }

// ----- turn rendering -----
function newTurnLine(){
  const d=document.createElement("div"); d.className="turn current";
  d.innerHTML='<span class="txt"></span><span class="interim"></span>';
  $("turns").appendChild(d); d.scrollIntoView({block:"end"});
  return { el:d, txt:d.querySelector(".txt"), interim:d.querySelector(".interim"), committed:"" };
}
function ensureTurn(){ if(!curTurn) curTurn=newTurnLine(); return curTurn; }
function onPartial(text){ const t=ensureTurn(); t.interim.textContent=(t.committed?" ":"")+text; }
function onFinal(text){ const t=ensureTurn(); if(text){ t.committed=(t.committed?t.committed+" ":"")+text; t.txt.textContent=t.committed; } t.interim.textContent=""; }
function onTurnEnd(reason,text){
  const t=ensureTurn();
  if(text) t.txt.textContent=text;
  t.interim.textContent="";
  t.el.classList.remove("current"); t.el.classList.add("done");
  const b=document.createElement("span"); b.className="badge "+reason;
  b.textContent = (reason==="silence"?"⏱ silence":reason==="audio"?"🔊 prosody":reason==="text"?"📝 semantics":"✓ "+reason);
  t.txt.after(b);
  curTurn=null;              // next speech starts a fresh line
  setBars(0,0,0);
}

function setBars(a,txt,silMs){
  $("barAudio").style.width=Math.min(100,a*100)+"%"; $("valAudio").textContent=a.toFixed(2);
  $("barText").style.width=Math.min(100,txt*100)+"%"; $("valText").textContent=txt.toFixed(2);
  const f=Math.min(100,silMs/backstopMs*100); $("barSil").style.width=f+"%"; $("valSil").textContent=(silMs/1000).toFixed(1)+"s";
}

// ----- audio capture (mic -> 16k PCM16 -> ws) -----
function pushSample(f){ let s=Math.max(-1,Math.min(1,f)); pcmQueue.push(s<0?s*0x8000:s*0x7fff); }
function onAudioFrame(f32,inRate){
  if(inRate===TARGET_SR){ for(let i=0;i<f32.length;i++) pushSample(f32[i]); }
  else { const ratio=inRate/TARGET_SR;
    while(resampPos<f32.length){ const idx=Math.floor(resampPos),frac=resampPos-idx;
      const a=f32[idx],b=idx+1<f32.length?f32[idx+1]:f32[idx]; pushSample(a+(b-a)*frac); resampPos+=ratio; }
    resampPos-=f32.length; }
  while(pcmQueue.length>=FRAME_SAMPLES){ const fr=Int16Array.from(pcmQueue.splice(0,FRAME_SAMPLES));
    if(ws&&ws.readyState===WebSocket.OPEN) ws.send(fr.buffer); }
}

async function start(){
  const url=$("url").value.trim(), key=$("key").value.trim();
  if(!url){ alert("WS URL is empty."); return; }
  startBtn.disabled=true; $("turns").innerHTML=""; curTurn=null; pcmQueue=[]; resampPos=0; setBars(0,0,0);
  const wsUrl = key ? url+(url.includes("?")?"&":"?")+"api_key="+encodeURIComponent(key) : url;
  setStatus("connecting…"); ws=new WebSocket(wsUrl); ws.binaryType="arraybuffer";
  ws.onopen=()=>{ log("ws open"); ws.send(JSON.stringify({type:"start",sample_rate:TARGET_SR,encoding:"pcm_s16le",enable_partials:true})); };
  ws.onmessage=(ev)=>{ if(typeof ev.data!=="string") return; const m=JSON.parse(ev.data);
    if(m.type==="ready"){ backstopMs=m.silence_backstop_ms||4000; setStatus("listening — talk!",true); stopBtn.disabled=false; beginCapture(); }
    else if(m.type==="partial"){ onPartial(m.text); }
    else if(m.type==="final"){ onFinal(m.text); }
    else if(m.type==="eou"){ if(m.source==="audio"){ const v=$("barAudio"); v.style.width=Math.min(100,m.p*100)+"%"; $("valAudio").textContent=m.p.toFixed(2);} else { $("barText").style.width=Math.min(100,m.p*100)+"%"; $("valText").textContent=m.p.toFixed(2);} }
    else if(m.type==="silence"){ const f=Math.min(100,m.ms/backstopMs*100); $("barSil").style.width=f+"%"; $("valSil").textContent=(m.ms/1000).toFixed(1)+"s"; }
    else if(m.type==="turn_end"){ log("TURN END ("+m.reason+")  audio="+m.p_audio+" text="+m.p_text); onTurnEnd(m.reason,m.text); }
    else if(m.type==="error"){ log("error: "+m.code+" "+m.message); }
  };
  ws.onclose=(e)=>{ log("ws closed "+e.code); cleanup(); };
  ws.onerror=()=>{ log("ws error (check the proxy is running / port forwarded)"); };
}

async function beginCapture(){
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ log("mic denied: "+e); stop(); return; }
  audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:TARGET_SR});
  const inRate=audioCtx.sampleRate; log("audio sample rate: "+inRate+(inRate===TARGET_SR?"":" (resampling)"));
  const code=`class Capture extends AudioWorkletProcessor{process(i){const c=i[0][0]; if(c) this.port.postMessage(c.slice(0)); return true;}} registerProcessor('capture',Capture);`;
  await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:"application/javascript"})));
  sourceNode=audioCtx.createMediaStreamSource(micStream); workletNode=new AudioWorkletNode(audioCtx,"capture");
  workletNode.port.onmessage=(e)=>{ const f=e.data; let pk=0; for(let i=0;i<f.length;i++){const a=Math.abs(f[i]); if(a>pk)pk=a;} levelEl.style.width=Math.min(100,pk*140)+"%"; onAudioFrame(f,inRate); };
  sourceNode.connect(workletNode);
}
function stop(){ if(ws&&ws.readyState===WebSocket.OPEN){ try{ws.send(JSON.stringify({type:"close"}));}catch(e){} } setStatus("stopping…"); stopBtn.disabled=true; }
function cleanup(){ try{workletNode&&workletNode.disconnect()}catch(e){} try{sourceNode&&sourceNode.disconnect()}catch(e){} try{micStream&&micStream.getTracks().forEach(t=>t.stop())}catch(e){} try{audioCtx&&audioCtx.close()}catch(e){} levelEl.style.width="0"; startBtn.disabled=false; stopBtn.disabled=true; setStatus("idle",false); }

(function(){ const u=$("url"); if(!u.value){ u.value=location.host?((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/v1/stream"):"ws://localhost:8117/v1/stream"; } })();
startBtn.onclick=start; stopBtn.onclick=stop;
</script>
</body>
</html>
